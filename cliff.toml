# Release notes for git-cliff (pnpm exec git-cliff). Only the changes users notice: docs, style,
# refactor, test, build, ci and chore commits are left out unless they are marked breaking with "!".

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.id | truncate(length=7, end="") }} {{ commit.raw_message | split(pat="\n") | first }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The first matching parser wins; the HTML comments only set the order of the groups
commit_parsers = [
  { message = "^[a-z]+!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat:", group = "<!-- 1 -->Features" },
  { message = "^fix:", group = "<!-- 2 -->Fixes" },
  { message = "^perf:", group = "<!-- 3 -->Performance" },
  { message = "^revert:", group = "<!-- 4 -->Reverts" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
